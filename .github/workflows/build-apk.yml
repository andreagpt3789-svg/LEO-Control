name: Build LEO Control Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: leo-control-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout LEO builder
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: leo-control-debug-keystore-v1

      - name: Ensure persistent debug signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore ~/.android/debug.keystore               -storepass android               -keypass android               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=LEO Control,C=IT"
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler python3-protobuf

      - name: Fetch pinned chiaki-ng source
        run: |
          git clone https://github.com/streetpea/chiaki-ng.git upstream
          cd upstream
          git checkout a9a2805884cfa83865fdfcc09ca3ddfcd628aa42
          git submodule update --init --recursive

      - name: Apply LEO Control integration
        run: python3 scripts/apply_overlay.py

      - name: Build debug APK
        working-directory: upstream/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp upstream/android/app/build/outputs/apk/debug/app-debug.apk out/LEO-Control-Android-v0.13.5-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEO-Control-Android-v0.13.5
          path: out/LEO-Control-Android-v0.13.5-debug.apk
          if-no-files-found: error
